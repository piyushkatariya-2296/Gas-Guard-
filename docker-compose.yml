version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: gasguard-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: gasguard
    volumes:
      - mongo_data:/data/db

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: gasguard-mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docs/mosquitto.conf:/mosquitto/config/mosquitto.conf

volumes:
  mongo_data:
