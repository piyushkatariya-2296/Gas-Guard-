name: Build GasGuard Android & iOS Mobile Apps

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & Google Play Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci

      - name: Build Web App & Sync Capacitor
        run: |
          cd mobile
          npm run build
          npx cap sync android

      - name: Make Gradle executable
        run: chmod +x mobile/android/gradlew

      - name: Build Android APK (Debug & Release)
        run: |
          cd mobile/android
          ./gradlew assembleDebug assembleRelease

      - name: Build Google Play Store Bundle (.aab)
        run: |
          cd mobile/android
          ./gradlew bundleRelease

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: gasguard-android-apk
          path: mobile/android/app/build/outputs/apk/**/*.apk

      - name: Upload Google Play Store Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: gasguard-playstore-bundle-aab
          path: mobile/android/app/build/outputs/bundle/**/*.aab

  build-ios:
    name: Build iOS Native Archive
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci

      - name: Build Web App & Sync Capacitor iOS
        run: |
          cd mobile
          npm run build
          npx cap sync ios

      - name: Verify iOS Project Structure
        run: |
          cd mobile/ios/App
          ls -la

      - name: Package iOS Project Workspace
        run: |
          cd mobile/ios
          tar -czf ../../gasguard-ios-project.tar.gz App

      - name: Upload iOS Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gasguard-ios-project
          path: gasguard-ios-project.tar.gz
